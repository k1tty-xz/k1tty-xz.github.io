name: Update Python package feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-feed.yml

permissions:
  contents: write

env:
  SOURCE_REPO: k1tty-xz/python-ios
  ARTIFACT_NAME: python-ios-framework

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          artifact="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${SOURCE_REPO}/actions/artifacts?per_page=100" \
            | jq -cer --arg name "$ARTIFACT_NAME" \
              '[.artifacts[] | select(.expired == false and .name == $name)]
               | sort_by(.updated_at) | last')"

          artifact_id="$(jq -r .id <<<"$artifact")"
          expected_digest="$(jq -r .digest <<<"$artifact")"
          archive="$work/artifact.zip"

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$archive" \
            "https://api.github.com/repos/${SOURCE_REPO}/actions/artifacts/${artifact_id}/zip"

          test "$expected_digest" = "sha256:$(sha256sum "$archive" | cut -d ' ' -f 1)"
          unzip -q "$archive" -d "$work/package"
          package="$(find "$work/package" -type f -name '*.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb --field "$package" Package)" = com.python.ios.framework
          test "$(dpkg-deb --field "$package" Architecture)" = iphoneos-arm
          CPYTHON_VERSION="$(dpkg-deb --field "$package" Version)"

          rm -f debs/*.deb
          install -m 0644 "$package" \
            "debs/com.python.ios.framework_${CPYTHON_VERSION}_iphoneos-arm.deb"
          printf 'CPYTHON_VERSION=%s\n' "$CPYTHON_VERSION" >> "$GITHUB_ENV"

      - name: Update repository indexes
        run: |
          set -euo pipefail
          icon_override="$RUNNER_TEMP/python-ios-icon.override"
          printf '%s\n' \
            'com.python.ios.framework Icon https://k1tty-xz.github.io/assets/python-ios-icon.png' \
            > "$icon_override"
          dpkg-scanpackages -m -e "$icon_override" debs /dev/null > Packages
          gzip -9 -n -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2

          {
            printf '%s\n' \
              'Origin: k1tty-xz' \
              'Label: k1tty-xz' \
              'Suite: stable' \
              "Version: $CPYTHON_VERSION" \
              'Codename: ios' \
              'Architectures: iphoneos-arm' \
              'Components: main' \
              'Description: Python 3.14.7 for jailbroken iOS' \
              '' \
              'MD5Sum:'
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %16s %s\n' \
                "$(md5sum "$file" | cut -d ' ' -f 1)" "$(stat -c '%s' "$file")" "$file"
            done
            printf '%s\n' 'SHA256:'
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %16s %s\n' \
                "$(sha256sum "$file" | cut -d ' ' -f 1)" "$(stat -c '%s' "$file")" "$file"
            done
          } > Release

          git diff --check

      - name: Commit feed update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Packages Packages.gz Packages.bz2 Release debs
          git diff --cached --quiet && exit 0
          git commit -m "Update Python package feed $CPYTHON_VERSION"
          git push

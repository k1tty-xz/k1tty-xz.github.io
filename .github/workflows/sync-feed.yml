name: Sync Python package feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: k1tty-xz/python-ios
      PACKAGE_VERSION: 3.14.7-2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the latest successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          trap 'rm -rf "${staging}"' EXIT

          for layout in rootful rootless; do
            case "${layout}" in
              rootful) package_arch=iphoneos-arm ;;
              rootless) package_arch=iphoneos-arm64 ;;
            esac
            artifact_name="python3-ios-${layout}_${PACKAGE_VERSION}_${package_arch}.deb"
            artifact_id="$(curl --fail-with-body -sS \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/actions/artifacts?per_page=100" |
              jq -er --arg name "${artifact_name}" '
                [.artifacts[] | select(.name == $name and .expired == false)]
                | sort_by(.updated_at) | last | .id')"

            package_path="${staging}/${artifact_name}"
            curl --fail-with-body -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "${package_path}" \
              "https://api.github.com/repos/${SOURCE_REPO}/actions/artifacts/${artifact_id}/zip"

            test "$(dpkg-deb --field "${package_path}" Package)" = "python3-ios-${layout}"
            test "$(dpkg-deb --field "${package_path}" Name)" = "Python 3.14"
            test "$(dpkg-deb --field "${package_path}" Version)" = "${PACKAGE_VERSION}"
            test "$(dpkg-deb --field "${package_path}" Architecture)" = "${package_arch}"
          done

          rm -f debs/*.deb
          mv "${staging}"/*.deb debs/

      - name: Rebuild repository metadata
        run: |
          set -euo pipefail
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -n -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2

          {
            printf '%s\n' \
              "Origin: k1tty-xz" \
              "Label: k1tty-xz" \
              "Suite: stable" \
              "Version: ${PACKAGE_VERSION}" \
              "Codename: ios" \
              "Architectures: iphoneos-arm iphoneos-arm64" \
              "Components: main" \
              "Description: Standalone CPython for iOS" \
              "" \
              "MD5Sum:"
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %8s %s\n' "$(md5sum "${file}" | cut -d ' ' -f 1)" "$(stat -c '%s' "${file}")" "${file}"
            done
            printf '%s\n' "SHA256:"
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %8s %s\n' "$(sha256sum "${file}" | cut -d ' ' -f 1)" "$(stat -c '%s' "${file}")" "${file}"
            done
          } > Release

      - name: Publish changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Release debs
          if git diff --cached --quiet; then
            echo "Repository is already current."
            exit 0
          fi
          git commit -m "Sync Python ${PACKAGE_VERSION}"
          git push

name: Update Python package feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-feed.yml

permissions:
  contents: write

env:
  SOURCE_REPO: k1tty-xz/python-ios

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find latest package artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="$(gh api \
            "repos/${SOURCE_REPO}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[]
              | select(.expired == false
                and (.name | endswith(".deb"))
                and .workflow_run.head_branch == "main")]
              | max_by(.updated_at)')"
          test "$artifact" != null
          echo "id=$(jq -r .id <<<"$artifact")" >> "$GITHUB_OUTPUT"
          echo "run_id=$(jq -r .workflow_run.id <<<"$artifact")" >> "$GITHUB_OUTPUT"

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          github-token: ${{ github.token }}
          repository: ${{ env.SOURCE_REPO }}
          run-id: ${{ steps.artifact.outputs.run_id }}
          path: package

      - name: Install package
        id: package
        run: |
          set -euo pipefail
          set -- package/*.deb
          test "$#" -eq 1
          package=$1
          test "$(dpkg-deb --field "$package" Package)" = com.python.ios.framework
          test "$(dpkg-deb --field "$package" Architecture)" = iphoneos-arm

          version=$(dpkg-deb --field "$package" Version)
          rm -f debs/*.deb
          install -m 0644 "$package" "debs/com.python.ios.framework_${version}_iphoneos-arm.deb"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update repository indexes
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'com.python.ios.framework Icon https://k1tty-xz.github.io/assets/python-ios-icon.png' \
            > "$RUNNER_TEMP/python-ios-icon.override"
          dpkg-scanpackages -m -e "$RUNNER_TEMP/python-ios-icon.override" debs /dev/null > Packages
          gzip -9 -n -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2

          {
            printf '%s\n' \
              'Origin: k1tty-xz' \
              'Label: k1tty-xz' \
              'Suite: stable' \
              "Version: $VERSION" \
              'Codename: ios' \
              'Architectures: iphoneos-arm' \
              'Components: main' \
              "Description: Python $VERSION for jailbroken iOS" \
              '' \
              'MD5Sum:'
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %16s %s\n' \
                "$(md5sum "$file" | cut -d ' ' -f 1)" \
                "$(stat -c '%s' "$file")" "$file"
            done
            printf '%s\n' 'SHA256:'
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %16s %s\n' \
                "$(sha256sum "$file" | cut -d ' ' -f 1)" \
                "$(stat -c '%s' "$file")" "$file"
            done
          } > Release

          git diff --check

      - name: Commit feed update
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Packages Packages.gz Release debs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Python package feed $VERSION"
          git push

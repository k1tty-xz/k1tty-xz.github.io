name: Sync Python package feed

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: k1tty-xz/python-ios-arm64
      ARTIFACT_NAME: python3.14-ios-arm64
      PACKAGE_VERSION: 3.14.7-1
      PACKAGE_ARCH: iphoneos-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download the latest successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          artifact_id="$(curl --fail-with-body -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${SOURCE_REPO}/actions/artifacts?per_page=100" |
            jq -er --arg name "${ARTIFACT_NAME}" '
              [.artifacts[] | select(.name == $name and .expired == false)]
              | sort_by(.updated_at) | last | .id')"

          curl --fail-with-body -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o artifact.zip \
            "https://api.github.com/repos/${SOURCE_REPO}/actions/artifacts/${artifact_id}/zip"

          mkdir artifact
          unzip -q artifact.zip -d artifact
          package_path="$(find artifact -type f -name '*.deb' -print -quit)"
          test -n "${package_path}"
          test "$(dpkg-deb --field "${package_path}" Version)" = "${PACKAGE_VERSION}"
          test "$(dpkg-deb --field "${package_path}" Architecture)" = "${PACKAGE_ARCH}"

          rm -f debs/*.deb
          mv "${package_path}" "debs/$(basename "${package_path}")"

      - name: Rebuild repository metadata
        run: |
          set -euo pipefail
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -n -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2

          {
            printf '%s\n' \
              "Origin: k1tty-xz" \
              "Label: k1tty-xz" \
              "Suite: stable" \
              "Version: ${PACKAGE_VERSION}" \
              "Codename: ios" \
              "Architectures: ${PACKAGE_ARCH}" \
              "Components: main" \
              "Description: Python 3.14 for arm64 iOS" \
              "" \
              "MD5Sum:"
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %8s %s\n' "$(md5sum "${file}" | cut -d ' ' -f 1)" "$(stat -c '%s' "${file}")" "${file}"
            done
            printf '%s\n' "SHA256:"
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %8s %s\n' "$(sha256sum "${file}" | cut -d ' ' -f 1)" "$(stat -c '%s' "${file}")" "${file}"
            done
          } > Release

      - name: Publish changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 Release debs
          if git diff --cached --quiet; then
            echo "Repository is already current."
            exit 0
          fi
          git commit -m "Sync Python ${PACKAGE_VERSION}"
          git push

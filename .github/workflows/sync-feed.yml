name: Publish latest CPython and universal Frida packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-feed.yml

permissions:
  contents: write

env:
  SOURCE_REPO: k1tty-xz/python-ios
  CPYTHON_ARTIFACT_PATTERN: ^python3\.14_.+_iphoneos-arm_rootful\.deb$
  FRIDA_ARTIFACT_PATTERN: ^python3\.14-frida_.+_iphoneos-arm64\.deb$

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download latest packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          download_artifact() {
            local pattern="$1"
            local expected_package="$2"
            local expected_arch="$3"
            local artifact artifact_id deb_name expected_digest package

            artifact="$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${SOURCE_REPO}/actions/artifacts?per_page=100" \
              | jq -cer --arg pattern "$pattern" \
                '[.artifacts[] | select(.expired == false and (.name | test($pattern)))]
                 | sort_by(.updated_at) | last')"

            artifact_id="$(jq -r .id <<<"$artifact")"
            deb_name="$(jq -r .name <<<"$artifact")"
            expected_digest="$(jq -r .digest <<<"$artifact")"
            package="$work/$deb_name"

            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$package" \
              "https://api.github.com/repos/${SOURCE_REPO}/actions/artifacts/${artifact_id}/zip"

            test "$expected_digest" = "sha256:$(sha256sum "$package" | cut -d ' ' -f 1)"
            test "$(dpkg-deb --field "$package" Package)" = "$expected_package"
            test "$(dpkg-deb --field "$package" Architecture)" = "$expected_arch"
            install -m 0644 "$package" "debs/$deb_name"
            dpkg-deb --field "$package" Version
          }

          rm -f debs/*.deb
          CPYTHON_VERSION="$(download_artifact "$CPYTHON_ARTIFACT_PATTERN" python3.14 iphoneos-arm)"
          FRIDA_VERSION="$(download_artifact "$FRIDA_ARTIFACT_PATTERN" python3.14-frida iphoneos-arm64)"
          printf 'CPYTHON_VERSION=%s\nFRIDA_VERSION=%s\n' \
            "$CPYTHON_VERSION" "$FRIDA_VERSION" >> "$GITHUB_ENV"

      - name: Rebuild feed metadata
        run: |
          set -euo pipefail
          dpkg-scanpackages -m debs /dev/null > Packages
          gzip -9 -n -c Packages > Packages.gz
          bzip2 -9 -c Packages > Packages.bz2

          {
            printf '%s\n' \
              'Origin: k1tty-xz' \
              'Label: k1tty-xz' \
              'Suite: stable' \
              "Version: $CPYTHON_VERSION" \
              'Codename: ios' \
              'Architectures: iphoneos-arm iphoneos-arm64' \
              'Components: main' \
              'Description: Standalone CPython and Frida Python bindings for iOS' \
              '' \
              'MD5Sum:'
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %16s %s\n' \
                "$(md5sum "$file" | cut -d ' ' -f 1)" "$(stat -c '%s' "$file")" "$file"
            done
            printf '%s\n' 'SHA256:'
            for file in Packages Packages.gz Packages.bz2; do
              printf ' %s %16s %s\n' \
                "$(sha256sum "$file" | cut -d ' ' -f 1)" "$(stat -c '%s' "$file")" "$file"
            done
          } > Release

          git diff --check

      - name: Publish
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Packages Packages.gz Packages.bz2 Release debs
          git diff --cached --quiet && exit 0
          git commit -m "Publish CPython $CPYTHON_VERSION and Frida $FRIDA_VERSION"
          git push

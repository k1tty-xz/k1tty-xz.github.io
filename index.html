<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101312">
  <meta name="description" content="Standalone CPython for jailbroken iOS.">
  <title>Python 3.14 for iOS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101312;
      --card: #171c1a;
      --text: #f2f5f3;
      --muted: #aab6b0;
      --line: #2b3530;
      --accent: #8fe388;
      --accent-ink: #102012;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 56px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 80px #0005;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 540px;
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    .intro {
      max-width: 560px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      margin: 32px 0;
      overflow: hidden;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .detail {
      padding: 14px 16px;
      background: var(--card);
    }

    .detail span {
      display: block;
      color: var(--muted);
      font-size: .82rem;
    }

    .detail strong { font-size: 1rem; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 650;
    }

    a.button:hover { border-color: var(--accent); }

    a.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .source {
      display: inline-block;
      margin-top: 28px;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: .85rem;
    }

    @media (max-width: 420px) {
      .details { grid-template-columns: 1fr; }
      a.button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Python 3.14 · iOS repository</p>
    <h1>CPython for jailbroken iOS.</h1>
    <p class="intro">
      A standalone CPython runtime for rootful and rootless jailbroken iOS.
    </p>

    <section class="details" aria-label="Package details">
      <div class="detail">
        <span>Current build</span>
        <strong>Python 3.14.7-2</strong>
      </div>
      <div class="detail">
        <span>Rootful</span>
        <strong>iphoneos-arm</strong>
      </div>
      <div class="detail">
        <span>Rootful path</span>
        <strong>/usr/local</strong>
      </div>
      <div class="detail">
        <span>Rootless path</span>
        <strong>/var/jb/usr/local</strong>
      </div>
    </section>

    <div class="actions">
      <a class="button primary" href="https://k1tty-xz.github.io/">Add repository</a>
      <a class="button" href="https://github.com/k1tty-xz/python-ios">View source</a>
    </div>

    <footer>Rootless ABI: <code>iphoneos-arm64</code>.</footer>
  </main>
</body>
</html>

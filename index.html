<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Python 3.14.7 for jailbroken iOS devices.">
  <title>Python 3.14.7 for iOS</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --line: #d2d2d7;
      --link: #06c;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--background);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #1d1d1f;
        --text: #f5f5f7;
        --muted: #a1a1a6;
        --line: #424245;
        --link: #2997ff;
      }
    }

    body {
      max-width: 44rem;
      margin: 0 auto;
      padding: 4rem 1.25rem 3rem;
    }

    header {
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
    }

    .site {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: .875rem;
    }

    h1 {
      margin: 0;
      font-size: 2.25rem;
      font-weight: 600;
      letter-spacing: -.03em;
    }

    .summary {
      margin: .5rem 0 0;
      color: var(--muted);
    }

    section { padding-top: 2rem; }

    h2 {
      margin: 0 0 .75rem;
      font-size: 1rem;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: .7rem 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      width: 40%;
      color: var(--muted);
      font-weight: 400;
    }

    code {
      font: .9em ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .links { margin-top: 1.5rem; }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <header>
    <p class="site">k1tty-xz.github.io</p>
    <h1>Python 3.14.7</h1>
    <p class="summary">CPython for rootful, jailbroken iOS devices.</p>
  </header>

  <main>
    <section aria-labelledby="package-heading">
      <h2 id="package-heading">Package</h2>
      <table>
        <tbody>
          <tr><th scope="row">Package</th><td><code>com.python.ios.framework</code></td></tr>
          <tr><th scope="row">Version</th><td>3.14.7-1</td></tr>
          <tr><th scope="row">Architecture</th><td>iphoneos-arm</td></tr>
          <tr><th scope="row">Prefix</th><td><code>/usr/local</code></td></tr>
          <tr><th scope="row">Contents</th><td>Standard library and pip</td></tr>
        </tbody>
      </table>

      <p class="links">
        <a href="debs/com.python.ios.framework_3.14.7-1_iphoneos-arm.deb">Download package</a>
      </p>
    </section>
  </main>

  <footer>
    Source and build details are available on
    <a href="https://github.com/k1tty-xz/python-ios">GitHub</a>.
  </footer>
</body>
</html>

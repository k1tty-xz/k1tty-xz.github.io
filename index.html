<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Python 3.14.7 for jailbroken iOS devices.">
  <title>Python 3.14.7 for iOS</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202124;
      background: #f6f7f8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color: #f1f3f4;
        background: #17191c;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    main {
      width: min(100%, 34rem);
      padding: 2rem;
      border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
      border-radius: .75rem;
      background: color-mix(in srgb, currentColor 4%, transparent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.1;
      letter-spacing: -.04em;
    }

    p {
      margin: .75rem 0 0;
      color: color-mix(in srgb, currentColor 68%, transparent);
    }

    h2 {
      margin: 2rem 0 .75rem;
      font-size: 1rem;
    }

    dl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem 1rem;
      margin: 0;
    }

    dt { color: color-mix(in srgb, currentColor 58%, transparent); }
    dd { margin: 0; text-align: right; }

    a {
      display: inline-block;
      margin-top: 1.5rem;
      color: inherit;
      font-weight: 600;
    }

    footer {
      margin-top: 2rem;
      color: color-mix(in srgb, currentColor 52%, transparent);
      font-size: .875rem;
    }

    @media (max-width: 28rem) {
      main { padding: 1.5rem; }
      dl { grid-template-columns: 1fr; gap: .25rem; }
      dd { text-align: left; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Python 3.14.7</h1>
    <p>CPython for rootful, jailbroken iOS devices.</p>

    <h2>Package</h2>
    <dl>
      <dt>Version</dt><dd>3.14.7-1</dd>
      <dt>Architecture</dt><dd>iphoneos-arm</dd>
      <dt>Install prefix</dt><dd>/usr/local</dd>
      <dt>Includes</dt><dd>Standard library and pip</dd>
    </dl>

    <a href="debs/com.python.ios.framework_3.14.7-1_iphoneos-arm.deb">Download package</a>
    <footer>
      <a href="https://github.com/k1tty-xz/python-ios">Source and build details</a>
    </footer>
  </main>
</body>
</html>
